<style>

:root{color-scheme:dark;--bg:#080b12;--blue:#8fb4ff;--gold:#f6d58c}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:#f5f7fb;overflow:hidden}.ambient{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 48%,#1b2944 0,#101827 43%,#080b12 77%);opacity:0;transition:opacity 1.4s}.ambient.on{opacity:1}.grain{position:fixed;inset:0;opacity:.11;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E")}.intro{position:fixed;z-index:5;inset:0;background:#080b12;display:grid;place-items:center;transition:opacity 1.35s,visibility 1.35s}.intro.gone{opacity:0;visibility:hidden;pointer-events:none}.phone{width:min(350px,86vw);height:min(690px,84svh);min-height:510px;padding:12px;border-radius:48px;border:1px solid #465064;background:linear-gradient(150deg,#202938,#10151f 46%,#0b1019);box-shadow:0 35px 120px #000a,0 0 0 5px #151b27;position:relative;transform:translateY(24px) scale(.96);opacity:0;animation:phoneIn 1s .15s cubic-bezier(.18,.8,.2,1) forwards;cursor:pointer}.phone:before{content:'';position:absolute;z-index:4;top:18px;left:50%;transform:translateX(-50%);width:91px;height:25px;background:#05070b;border-radius:18px}.phone-screen{height:100%;border-radius:38px;background:radial-gradient(ellipse at 50% 25%,#293951,#121a27 58%,#0b111a);display:flex;flex-direction:column;align-items:center;padding:56px 22px 22px;overflow:hidden;position:relative}.status{font-size:10px;letter-spacing:1px;color:#c4ccdb}.clock{font-size:66px;font-weight:500;letter-spacing:-4px;margin-top:18px}.date{font-size:15px;color:#d2d9e5;margin-top:-5px}.notification{margin-top:auto;width:100%;min-height:78px;padding:14px;border:1px solid #ffffff26;border-radius:17px;background:#ffffff13;backdrop-filter:blur(14px);display:flex;gap:11px;align-items:flex-start;transform:translateY(18px);opacity:0;animation:rise .65s 1.2s forwards}.appicon{width:31px;height:31px;border-radius:9px;background:linear-gradient(135deg,#6f9cff,#875deb);display:grid;place-items:center;font-size:16px}.notiftext{font-size:12px;line-height:1.5;color:#dfe5ef}.notiftext b{display:block;font-size:11px;color:white;margin-bottom:2px}.swipe{margin:24px 0 4px;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#b5bfd0;animation:pulse 2s 2s infinite}.homebar{width:102px;height:4px;border-radius:8px;background:#ffffffb0;margin-top:10px}.intro-label{position:absolute;top:calc(50% + min(354px,43svh));color:#8490a4;font-size:10px;text-transform:uppercase;letter-spacing:2px;white-space:nowrap;opacity:0;animation:fade .8s 1.4s forwards}@keyframes phoneIn{to{transform:none;opacity:1}}@keyframes rise{to{transform:none;opacity:1}}@keyframes pulse{50%{opacity:.5}}@keyframes fade{to{opacity:1}}.screen{min-height:100svh;display:grid;place-items:center;padding:28px;opacity:0;transition:opacity 1s}.screen.active{opacity:1}.experience{width:min(820px,100%);text-align:center;position:relative}.topline{position:absolute;top:-19vh;left:0;right:0;display:flex;justify-content:space-between;color:#8190a9;font-size:10px;letter-spacing:2px;text-transform:uppercase}.stage{min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center}.eyebrow{color:#9bb4d9;text-transform:uppercase;letter-spacing:3px;font-size:11px;font-weight:600;opacity:0;transform:translateY(10px);transition:.7s}.word{font:600 clamp(52px,11vw,112px)/1.04 Manrope,sans-serif;letter-spacing:-5px;margin:29px 0 0;opacity:0;transform:translateY(18px) scale(.98);transition:opacity .8s .1s,transform .9s cubic-bezier(.2,.8,.2,1) .1s}.stage.show .eyebrow,.stage.show .word{opacity:1;transform:none}.word.final{font-size:clamp(45px,9vw,96px);letter-spacing:-4px;color:#fbf6ec;text-shadow:0 0 55px #edcb8c30}.word.final span{display:block;color:var(--gold);margin-top:6px}.caption{font-size:15px;color:#aab5c8;margin-top:17px;opacity:0;transition:opacity .7s .4s}.stage.show .caption{opacity:1}.reveal-icon{width:132px;height:132px;border-radius:50%;border:1px solid #ffffff22;background:radial-gradient(circle at 35% 30%,#eaf1ff,#8299c3 36%,#34425f 69%,#1c2537);box-shadow:0 0 80px #88aef747,inset -15px -18px 28px #0c1424;display:grid;place-items:center;font-size:48px;margin-bottom:12px;opacity:0;transform:scale(.75);transition:all .9s cubic-bezier(.18,.8,.2,1)}.stage.show .reveal-icon{opacity:1;transform:scale(1)}.final .eyebrow{color:#d7bf8e}.final .caption{color:#d5d9e0}.flash{position:fixed;inset:0;z-index:10;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:flash .75s ease-out}@keyframes flash{0%{opacity:0}15%{opacity:.8}100%{opacity:0}}.confetti{position:fixed;z-index:11;left:50%;top:45%;width:9px;height:15px;pointer-events:none;animation:burst var(--dur) cubic-bezier(.1,.6,.2,1) forwards;animation-delay:var(--delay);border-radius:2px}@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(.5)}8%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--rot)) scale(1)}}.controls{min-height:44px;display:flex;justify-content:center;align-items:center;margin-top:16px}.continue{border:1px solid #45536a;background:#121b29;color:#e0e7f2;border-radius:99px;padding:12px 20px;font:600 12px 'DM Sans';cursor:pointer;transition:.2s;opacity:0;pointer-events:none}.continue.visible{opacity:1;pointer-events:auto}.continue:hover{border-color:#9bb6ed;background:#1a2638}.final .continue{border-color:#c9a766;background:#302a25;color:#f7deb0}.replay{position:fixed;right:20px;bottom:17px;border:0;background:none;color:#748097;font-size:10px;cursor:pointer;opacity:0;transition:opacity .5s}.replay.visible{opacity:.9}.sound{position:fixed;left:19px;bottom:17px;border:0;background:none;color:#758198;font:10px 'DM Sans';letter-spacing:.7px;cursor:pointer}.note{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:#8490a4;font-size:10px;letter-spacing:1px;text-transform:uppercase}.final .note{color:#af9d79}@media(max-height:700px){.topline{top:-12vh}.stage{min-height:310px}.word{margin-top:20px}.reveal-icon{width:105px;height:105px}.intro-label{top:calc(50% + min(325px,42svh))}}@media(max-width:550px){.screen{padding:20px}.topline{top:-15vh;font-size:8px}.word{letter-spacing:-3px}.word.final{letter-spacing:-2px}.stage{min-height:330px}.clock{font-size:60px}.phone{min-height:490px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head><body><div class="ambient" id="ambient"></div><div class="grain"></div><section class="intro" id="intro"><div class="phone" id="phone"><div class="phone-screen"><div class="status">◉ &nbsp; ▮▮▮ &nbsp; ▰</div><div class="clock" id="clock">9:41</div><div class="date" id="date">Thursday, October 16</div><div class="notification"><div class="appicon">✦</div><div class="notiftext"><b>A LITTLE BIRTHDAY SURPRISE</b>Someone has a message for you…</div></div><div class="swipe">Tap to open</div><div class="homebar"></div></div></div><div class="intro-label">A message for someone special</div></section><div class="flash" id="flash"></div><main class="screen" id="screen"><div class="experience"><div class="topline"><span>A MESSAGE FOR DAD</span><span id="counter">01 / 05</span></div><div class="stage" id="stage"></div><div class="controls"><button class="continue" id="continue">Continue&nbsp; →</button></div><div class="note" id="note">A little hello…</div></div><button class="sound" id="sound">♫ &nbsp; SOUND OFF</button><button class="replay" id="replay">↺ &nbsp; Play again</button></main>
<script>
(()=>{const $=id=>document.getElementById(id);let i=-1,started=false,audio=false,ctx=null,timer;const messages=[['A LITTLE HELLO','Hello,','A message for you.'],['JUST CHECKING IN','Wassup,','Hope you’re having a good one.'],['ONE MORE THING','Hi,','You know what day it is?'],['FROM AROUND THE WORLD','Bonjour,','Because one hello just wasn’t enough.'],['TODAY IS YOUR DAY','Happy Birthday,','Dad!','final']];function clock(){const d=new Date();$('clock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});$('date').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}clock();setInterval(clock,30000);function tone(freq=650,d=.3){if(!audio)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.045,ctx.currentTime+.04);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch{}}function confetti(){const colors=['#f4d28b','#8fb4ff','#f7f4ec','#c99dff','#82dfd0','#ff9bb2'];for(let n=0;n<150;n++){const e=document.createElement('i');e.className='confetti';e.style.background=colors[Math.random()*colors.length|0];e.style.setProperty('--x',`${Math.random()*innerWidth*1.2-innerWidth*.6}px`);e.style.setProperty('--y',`${Math.random()*innerHeight*1.3-innerHeight*.65}px`);e.style.setProperty('--rot',`${Math.random()*1000-500}deg`);e.style.setProperty('--dur',`${1.5+Math.random()*2.2}s`);e.style.setProperty('--delay',`${Math.random()*.35}s`);document.body.append(e);setTimeout(()=>e.remove(),4300)}}function advance(){clearTimeout(timer);i=Math.min(i+1,messages.length-1);const [label,word,caption,final]=messages[i],stage=$('stage');$('flash').classList.remove('go');if(final)$('flash').classList.add('go');stage.className='stage'+(final?' final':'');stage.innerHTML=`${final?'<div class="reveal-icon">✦</div>':''}<div class="eyebrow">${label}</div><h1 class="word ${final?'final':''}">${final?`${word}<span>${caption}</span>`:word}</h1>${final?'<p class="caption">Wishing you a brilliant day and a year full of good things.<br>With all our love. ♡</p>':`<p class="caption">${caption}</p>`}`;$('counter').textContent=`0${i+1} / 05`;$('note').textContent=final?'ALL OUR LOVE, ALWAYS':'A LITTLE HELLO…';requestAnimationFrame(()=>requestAnimationFrame(()=>stage.classList.add('show')));tone([560,620,680,740,880][i],.35);if(final){confetti();$('continue').classList.remove('visible');$('replay').classList.add('visible')}else{ $('continue').classList.remove('visible');setTimeout(()=>$('continue').classList.add('visible'),1300);timer=setTimeout(advance,5000)}}function start(){if(started)return;started=true;$('intro').classList.add('gone');setTimeout(()=>{$('screen').classList.add('active');$('ambient').classList.add('on');setTimeout(advance,500)},400)}$('phone').addEventListener('click',start);$('continue').onclick=advance;$('replay').onclick=()=>{i=-1;advance()};$('sound').onclick=()=>{audio=!audio;$('sound').textContent=audio?'♫  SOUND ON':'♫  SOUND OFF';if(ctx&&!audio)ctx.suspend();if(audio){if(ctx)ctx.resume();tone(600);setTimeout(()=>tone(800),160)}};document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){if(!started)start();else if($('continue').classList.contains('visible'))advance()}})})();
</script></body></html>
